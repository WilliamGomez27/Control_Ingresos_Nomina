<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Oficial de Licencias · William Gómez</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-sub: #334155;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --tx: #f8fafc;
            --tx-muted: #94a3b8;
            --bd: #334155;
            --ok: #22c55e;
            --wa: #25d366;
            --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--tx);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .icon {
            font-size: 44px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--tx-muted);
            margin-top: 4px;
        }

        .badge-autor {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11.5px;
            font-weight: 700;
            margin-top: 8px;
        }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--tx-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: var(--card-sub);
            border: 1px solid var(--bd);
            color: #fff;
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 12px;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .btn-gen {
            width: 100%;
            background: var(--primary);
            color: #0f172a;
            font-size: 14px;
            font-weight: 700;
            padding: 13px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.15s ease;
        }

        .btn-gen:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .result-box {
            display: none;
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .res-label {
            font-size: 11.5px;
            color: var(--tx-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .key-val {
            font-family: monospace;
            font-weight: 800;
            font-size: 21px;
            color: var(--primary);
            letter-spacing: 1.5px;
            margin: 8px 0 14px 0;
            user-select: all;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn-copy, .btn-wa {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-copy {
            background: var(--card-sub);
            color: #fff;
            border: 1px solid var(--bd);
        }

        .btn-copy:hover {
            background: #475569;
        }

        .btn-wa {
            background: var(--wa);
            color: #fff;
        }

        .btn-wa:hover {
            background: #1eb857;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            background: #0284c7;
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 11px;
            color: var(--tx-muted);
            border-top: 1px solid var(--bd);
            padding-top: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon">🔑</div>
            <h1>Generador de Licencias</h1>
            <div class="subtitle">Control de Ingresos Laborales</div>
            <div class="badge-autor">Exclusivo William Gómez (@WilliamGomez27)</div>
        </div>

        <div>
            <label for="deviceId">Pega el Código de Dispositivo del trabajador:</label>
            <input type="text" id="deviceId" placeholder="TLM-XXXX-YYYY" autofocus autocomplete="off" spellcheck="false">
            <button type="button" class="btn-gen" id="btnGenerar">Generar Clave de Activación ⚡</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="res-label">Clave de Activación Criptográfica</div>
            <div class="key-val" id="keyVal">ACT-XXXX-XXXX-XXXX</div>
            <div class="btn-row">
                <button type="button" class="btn-copy" id="btnCopiar">📋 Copiar Clave</button>
                <a class="btn-wa" id="btnWhatsApp" target="_blank">💬 Enviar WhatsApp</a>
            </div>
        </div>

        <div class="footer">
            🛡️ Sistema de firma determinista con salt maestro · Licencias personales e intransferibles
        </div>
    </div>

    <div class="toast" id="toast">Copiado al portapapeles ✓</div>

    <script>
        const LIC_SECRET = "WG-NOMINA-2026-TALMA-PROTECT-KEY-9281";

        function calcularClaveActivacion(deviceId) {
            if (!deviceId) return "";
            const cleanId = deviceId.trim().toUpperCase();
            const str = cleanId + ":" + LIC_SECRET;
            let h1 = 0x811c9dc5;
            let h2 = 0x55555555;
            for (let i = 0; i < str.length; i++) {
                const c = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ c, 0x01000193);
                h2 = Math.imul(h2 ^ c, 0x27d4eb2d);
            }
            const part1 = Math.abs(h1).toString(16).toUpperCase().padStart(8, "0");
            const part2 = Math.abs(h2).toString(16).toUpperCase().padStart(8, "0");
            return `ACT-${part1.slice(0, 4)}-${part2.slice(0, 4)}-${part1.slice(4, 8)}`;
        }

        const input = document.getElementById("deviceId");
        const btnGen = document.getElementById("btnGenerar");
        const resultBox = document.getElementById("resultBox");
        const keyVal = document.getElementById("keyVal");
        const btnCopy = document.getElementById("btnCopiar");
        const btnWa = document.getElementById("btnWhatsApp");
        const toast = document.getElementById("toast");

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2400);
        }

        function procesar() {
            const val = input.value.trim().toUpperCase();
            if (!val) {
                alert("Por favor ingresa o pega el código de dispositivo (Ej: TLM-8492-AX7K)");
                input.focus();
                return;
            }
            const clave = calcularClaveActivacion(val);
            keyVal.textContent = clave;
            resultBox.style.display = "block";

            const msg = encodeURIComponent(`Hola! Tu clave de activación para Control de Ingresos Laborales en tu dispositivo (${val}) es:\n\n${clave}\n\nIngrésala en la app para desbloquear tu acceso.`);
            btnWa.href = `https://wa.me/?text=${msg}`;

            showToast("✓ Clave generada con éxito");
        }

        btnGen.onclick = procesar;
        input.onkeydown = e => { if (e.key === "Enter") procesar(); };

        btnCopy.onclick = () => {
            const clave = keyVal.textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(clave).then(() => showToast("✓ Clave copiada al portapapeles"));
            } else {
                showToast("Clave: " + clave);
            }
        };
    </script>
</body>
</html>
